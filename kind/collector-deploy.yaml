# The collector for the kind drift job: the collector itself, plus a busybox
# sidecar on the same volume. The collector image has no shell and no tar, so
# `kubectl cp` reads the recording through the sidecar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  labels:
    app.kubernetes.io/name: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.163.2
          args: ["--config=/etc/otelcol/collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: data
              mountPath: /data
        - name: files
          image: busybox:1.37.0
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: collector-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: collector
spec:
  selector:
    app.kubernetes.io/name: collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
# The chart's NetworkPolicy lets the mcp server reach only DNS, the gateway and
# Hydra. NetworkPolicies add up, so this one opens the collector without
# restating the chart's rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-egress-to-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: sneakers
      app.kubernetes.io/component: mcp
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: collector
      ports:
        - port: 4317
          protocol: TCP
