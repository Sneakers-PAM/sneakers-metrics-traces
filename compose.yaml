# Starter observability stack for Sneakers: the OTLP collector in front of
# Tempo (traces), Prometheus (metrics), Loki (logs) and Grafana.
# `docker compose up` generates a throwaway certificate for
# collector.example.org; set OTLP_TLS_HOSTNAME to use another name.
name: sneakers-metrics-traces

services:
  certs:
    image: alpine:3.20.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        if [ ! -s /certs/tls.crt ]; then
          echo "certs: generating a throwaway certificate for $${OTLP_TLS_HOSTNAME}"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -days 30 -subj "/CN=$${OTLP_TLS_HOSTNAME}" -addext "subjectAltName=DNS:$${OTLP_TLS_HOSTNAME}" \
            -keyout /certs/tls.key -out /certs/tls.crt
          chmod 644 /certs/tls.crt /certs/tls.key
        else
          echo "certs: certificate already present"
        fi
    environment:
      OTLP_TLS_HOSTNAME: ${OTLP_TLS_HOSTNAME:-collector.example.org}
    volumes:
      - certs:/certs

  collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTLP_TLS_CERT_FILE: /certs/tls.crt
      OTLP_TLS_KEY_FILE: /certs/tls.key
      TEMPO_ENDPOINT: tempo:4317
      PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
      LOKI_ENDPOINT: http://loki:3100/otlp
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
      - certs:/certs:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      certs:
        condition: service_completed_successfully
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./stack/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./stack/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./stack/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./stack/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - prometheus
      - loki

volumes:
  certs:
  tempo-data:
  prometheus-data:
  loki-data:
